name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y rsync acl
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: docker build -t napback-source:0.1.0 docker
      - run: docker run --rm --network none --read-only napback-source:0.1.0
